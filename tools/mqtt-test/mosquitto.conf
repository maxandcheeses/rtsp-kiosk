# Mosquitto configuration for rtsp-kiosk MQTT dev test harness
# Allows anonymous connections and exposes both plain MQTT and WebSocket listeners

# Allow unauthenticated connections (dev only — production should use password_file)
allow_anonymous true

# Standard MQTT listener (TCP port 1883)
# Useful for CLI tools like mosquitto_pub/mosquitto_sub
listener 1883

# WebSocket MQTT listener (port 9001)
# Required for browser-based clients (MQTT.js)
listener 9001
protocol websockets

# WebSocket-over-TLS MQTT listener (port 9002)
listener 9002
protocol websockets
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# Browser WebSocket clients cannot present client certs via the JS API,
# so client cert auth must stay disabled on this listener.
require_certificate false
