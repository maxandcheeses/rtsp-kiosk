server {
    listen 80;
    server_name _;

    # Use Docker's internal DNS resolver; resolve upstreams at request time
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
    }

    # Public sanitised configs — safe to serve
    location = /streams.json {
        try_files /streams.json =404;
        add_header Cache-Control "no-cache";
    }

    location = /views.json {
        try_files /views.json =404;
        add_header Cache-Control "no-cache";
    }

    location = /actions.json {
        alias /usr/share/nginx/html/actions.json;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Block direct access to any other json files
    location ~* \.json$ {
        return 403;
    }

    # Cache bundled/static JS
    location ~* \.js$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/streams {
        set $streams_api http://streams-api:9998;
        proxy_pass $streams_api/;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location /api/actions {
        set $streams_api http://streams-api:9998;
        proxy_pass $streams_api/actions;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri =404;
    }
}