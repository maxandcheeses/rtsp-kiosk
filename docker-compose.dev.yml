services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8080:80"
    # Skip envsubst — source files are bind-mounted directly.
    # The JS handles unsubstituted $VAR literals gracefully in dev.
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./www/index.html:/usr/share/nginx/html/index.html:ro
      - ./www/js/app.js:/usr/share/nginx/html/js/app.js:ro
      - ./www/js/boot.js:/usr/share/nginx/html/js/boot.js:ro
      - ./www/js/config.js:/usr/share/nginx/html/js/config.js:ro
      - ./www/js/layouts.js:/usr/share/nginx/html/js/layouts.js:ro
      - ./www/js/views.js:/usr/share/nginx/html/js/views.js:ro
      - ./www/js/views-editor.js:/usr/share/nginx/html/js/views-editor.js:ro
      - ./www/js/camera-editor.js:/usr/share/nginx/html/js/camera-editor.js:ro
      - ./www/js/webrtc.js:/usr/share/nginx/html/js/webrtc.js:ro
      - ./www/js/mqtt.js:/usr/share/nginx/html/js/mqtt.js:ro
      - ./www/js/actions.js:/usr/share/nginx/html/js/actions.js:ro
      - ./www/js/ui.js:/usr/share/nginx/html/js/ui.js:ro
      - ./www/js/debug.js:/usr/share/nginx/html/js/debug.js:ro
      - ./data/streams.json:/usr/share/nginx/html/streams.json:ro
      - ./data/views.json:/usr/share/nginx/html/views.json:ro
      - ./data/actions.json:/usr/share/nginx/html/actions.json:ro
      - ./tools/mqtt-test/index.html:/usr/share/nginx/html/mqtt-test.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mediamtx
      - streams-api
      - mqtt

  streams-api:
    build:
      context: ./streams-api
      dockerfile: Dockerfile
    volumes:
      - ./data:/data
    environment:
      - STREAMS_FILE=/data/streams.json
      - VIEWS_FILE=/data/views.json
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - STREAMS_API_KEY=${STREAMS_API_KEY:-}

  mediamtx:
    build:
      context: .
      dockerfile: Dockerfile.mediamtx
    ports:
      - "8889:8889"     # WebRTC/WHEP HTTP
      - "8189:8189/udp" # WebRTC ICE/UDP
    environment:
      HOST_IP: "${HOST_IP:-127.0.0.1}"
      STUN_PORT: "3478"
    volumes:
      - ./data:/data
    depends_on:
      - fake-streams

  fake-streams:
    build:
      context: ./tools/fake-streams
      dockerfile: Dockerfile

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./tools/mqtt-test/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
